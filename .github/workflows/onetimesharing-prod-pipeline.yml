# This workflow does a clean installation of node dependencies, caches/restores them, builds the source code, runs tests and deploys.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: OneTimeSharing Production Deployment

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js (version pinned in .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: |
            ./app/package-lock.json
            ./handlers/package-lock.json
            ./infra/package-lock.json
      - name: Pin npm version
        run: |
          npm install --global npm@11.19.1
          npm --version
      - name: Add SHORT_SHA env property with commit short sha
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV
      - name: Add the environment name as env property
        run: echo "ENVIRONMENT=prod" >> $GITHUB_ENV
      - name: Install deps (Frontend)
        working-directory: ./app
        run: npm ci
      - name: Install deps (Backend)
        working-directory: ./handlers
        run: npm ci
      - name: Install deps (Infra)
        working-directory: ./infra
        run: npm ci
      - name: Run tests
        working-directory: ./handlers
        run: npm run test
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1 # or your preferred AWS region
      - name: Deploy the CDK (Prod)
        working-directory: ./infra
        run: npm run deploy
